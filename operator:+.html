      <main class="container"><h1><code>+</code> and <code>+=</code> Operators</h1>
<p><code>+</code> adds two <a href="/type:Int.html"><code>Int</code></a> values together. For <a href="/type:Float.html"><code>Float</code></a> values, see <a href="/operator:plusdot.html"><code>+.</code></a>.</p>
<div class="snippet"><div class="snippet-titlebar"><span class="code-title">Example</span><div class="snippet-actions"><button class="run-snippet" type="button">Run</button><button class="edit-snippet" type="button">Edit</button></div></div><pre><code>1 <span class="operator">+</span> 2 <span class="comment">//-&gt; 3</span></code></pre><div class="snippet-output" role="status" aria-live="polite" hidden></div></div>
<p>You can use <code>+=</code> to add and assign to a variable.</p>
