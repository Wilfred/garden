name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker.yml'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'playground/Dockerfile'
      - 'playground/package*.json'
      - 'playground/tsconfig.json'
      - 'playground/index.ts'
  pull_request:
    paths:
      - '.github/workflows/docker.yml'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'playground/Dockerfile'
      - 'playground/package*.json'
      - 'playground/tsconfig.json'
      - 'playground/index.ts'

jobs:
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Set image tag
        id: image
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/garden-playground:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: playground/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=garden-playground
          cache-to: type=gha,scope=garden-playground,mode=max
