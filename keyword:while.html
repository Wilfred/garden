      <main class="container"><h1><code>while</code> keyword</h1>
<p><code>while</code> runs a block code repeatedly, whilst an expression evaluates to
<code>True</code>.</p>
<div class="snippet"><div class="snippet-titlebar"><span class="code-title">Example</span><div class="snippet-actions"><button class="run-snippet" type="button">Run</button><button class="edit-snippet" type="button">Edit</button></div></div><pre><code><a class="keyword" href="/keyword:let.html">let</a> nums <a class="operator" href="/operator:=.html">=</a> [1, 2, 3]

<a class="keyword" href="/keyword:let.html">let</a> i <a class="operator" href="/operator:=.html">=</a> 0
<a class="keyword" href="/keyword:while.html">while</a> i <a class="operator" href="/operator:<.html">&lt;</a> nums.len() {
  <a class="keyword" href="/keyword:let.html">let</a> num <a class="operator" href="/operator:=.html">=</a> nums.get(i)
  <a href="/fun:__prelude.gdn::dbg.html">dbg</a>(num)

  i <a class="operator" href="/operator:+=.html">+=</a> 1
}</code></pre><div class="snippet-output" role="status" aria-live="polite" hidden></div></div>
<p>For looping when you have a list, see
<a href="./keyword:for.html"><code>for</code></a>.</p></main>
