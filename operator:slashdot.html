      <main class="container"><h1><code>/.</code> Operator</h1>
<p><code>/.</code> performs division of <a href="/type:Float.html"><code>Float</code></a> values. For <a href="/type:Int.html"><code>Int</code></a> values, see <a href="/operator:slash.html"><code>/</code></a>.</p>
<div class="snippet"><div class="snippet-titlebar"><span class="code-title">Example</span><div class="snippet-actions"><button class="run-snippet" type="button">Run</button><button class="edit-snippet" type="button">Edit</button></div></div><pre><code>7.0 <span class="operator">/.</span> 2.0 <span class="comment">//-&gt; 3.5</span></code></pre><div class="snippet-output" role="status" aria-live="polite" hidden></div></div>
<p>Dividing by zero throws an exception.</p>
<div class="snippet"><div class="snippet-titlebar"><span class="code-title">Example</span><div class="snippet-actions"><button class="run-snippet" type="button">Run</button><button class="edit-snippet" type="button">Edit</button></div></div><pre><code>42.0 <span class="operator">/.</span> 0.0 <span class="comment">//-&gt; *exception*</span></code></pre><div class="snippet-output" role="status" aria-live="polite" hidden></div></div></main>
